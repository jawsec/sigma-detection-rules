name: Kino lucene Linux ingestion contract
priority: 30
transformations:
    - id: source_sshd
      type: add_condition
      conditions:
          event.dataset: system.auth
          process.name: sshd
      rule_conditions:
          - type: logsource
            product: linux
            service: sshd
    - id: source_sudo
      type: add_condition
      conditions:
          event.dataset: system.auth
          process.name: sudo
      rule_conditions:
          - type: logsource
            product: linux
            service: sudo
    - id: source_auditd
      type: add_condition
      conditions:
          event.dataset: auditd.log
      rule_conditions:
          - type: logsource
            product: linux
            service: auditd
    - id: message_mapping
      type: field_name_mapping
      mapping:
          message: message
      rule_conditions:
          - type: logsource
            product: linux
    - id: auditd_fields
      type: field_name_mapping
      mapping:
          type: auditd.log.record_type
          key: auditd.log.key
          success: auditd.log.success
      rule_conditions:
          - type: logsource
            product: linux
            service: auditd
