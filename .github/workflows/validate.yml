name: Validate detection content
'on':
    push:
    pull_request:
permissions:
    contents: read
jobs:
    validate:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-python@v5
              with:
                  python-version: '3.12'
                  cache: pip
            - run: python -m pip install -r requirements-dev.txt
            - run: yamllint -s .
            - run: python scripts/check.py
            - run: sigma check -x d3_fendtag --fail-on-issues .build/validation/
            - run: python scripts/coverage.py --check
            - run: python scripts/convert.py splunk
            - run: python scripts/convert.py lucene
            - run: python scripts/convert.py kusto
            - name: Compile Splunk correlation
              run: sigma convert -t splunk -p splunk_windows .build/correlation/ > .build/correlation.spl
            - run: python -m unittest discover -s tests -v
            - uses: actions/upload-artifact@v4
              with:
                  name: conversion-output
                  path: .build/
                  include-hidden-files: true
