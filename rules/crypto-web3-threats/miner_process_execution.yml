title: Potential Cryptocurrency Miner Execution
id: e3185fc2-e990-4a0e-b494-47a631346fe7
related:
    - id: 7a3f2e01-d4c8-4b91-a1f3-5e8c9d2b4a13
      type: obsolete
status: experimental
description: |
    Detects selected miner executable names or Stratum URI markers in process command lines.
    A process name can be spoofed and a URI can appear in inert text. This rule does not
    establish mining or authorization. Wallet applications alone are not treated as malicious.
references:
    - https://xmrig.com/docs/miner/command-line-options
author: jawsec
date: 2026-09-17
tags:
    - attack.impact
    - attack.t1496.001
logsource:
    category: process_creation
    product: windows
detection:
    selection_image:
        Image|endswith:
            - '\xmrig.exe'
            - '\nanominer.exe'
            - '\lolMiner.exe'
            - '\nbminer.exe'
    selection_protocol:
        CommandLine|contains:
            - stratum+tcp://
            - stratum+ssl://
    condition: 1 of selection_*
falsepositives:
    - Authorized mining, software tests, and commands containing example Stratum URLs
level: medium
