title: Binance API Header Marker in Curl Command Line
id: f9598d3e-c872-4e7b-bd5b-077a89b0e577
related:
    - id: 7a3f2e01-d4c8-4b91-a1f3-5e8c9d2b4a12
      type: obsolete
status: experimental
description: |
    Detects curl command lines containing the Binance API-key header marker.
    This flags potential command-line secret exposure, not seed phrases, a verified key,
    credential theft, or exfiltration. Empty headers and test values also match.
references:
    - https://developers.binance.com/docs/binance-spot-api-docs/rest-api/request-security
author: jawsec
date: 2026-09-17
tags:
    - detection.threat-hunting
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        Image|endswith: '\curl.exe'
        CommandLine|contains: 'X-MBX-APIKEY:'
    condition: selection
falsepositives:
    - Authorized integrations, documentation examples, and sandbox API tests
level: low
