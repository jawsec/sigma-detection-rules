title: Member Added to Local Administrators Group
id: 59618ca7-1597-4cd0-93a3-aab14b7f3729
status: experimental
description: |
    Detects a member added to the built-in Administrators group using its language-independent SID.
    The member can be a user, group, or computer. This event does not establish account creation
    or bypass of an authorization boundary.
references:
    - https://learn.microsoft.com/en-us/previous-versions/windows/it-pro/windows-10/security/threat-protection/auditing/event-4732
author: jawsec
date: 2026-04-01
modified: 2026-09-17
tags:
    - attack.persistence
    - attack.privilege-escalation
    - attack.t1098.007
logsource:
    product: windows
    service: security
detection:
    selection:
        EventID: 4732
        TargetSid: S-1-5-32-544
    condition: selection
falsepositives:
    - Approved onboarding, endpoint management, and temporary administrative access
level: medium
