title: Windows Security Log Cleared
id: 5ccc1296-0de7-4bdd-830b-cd001d522d62
status: experimental
description: |
    Detects event 1102 indicating the Windows Security log was cleared.
    Application or System log clearing is outside this rule. Provisioning and lab resets
    can be legitimate; corroborate the actor and change record.
references:
    - https://learn.microsoft.com/en-us/previous-versions/windows/it-pro/windows-10/security/threat-protection/auditing/event-1102
author: jawsec
date: 2026-04-01
modified: 2026-09-17
tags:
    - attack.defense-impairment
    - attack.t1685.005
logsource:
    product: windows
    service: security
detection:
    selection:
        EventID: 1102
    condition: selection
falsepositives:
    - Approved image preparation, lab resets, or administrative log maintenance
level: high
