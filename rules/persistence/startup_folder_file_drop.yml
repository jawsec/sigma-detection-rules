title: File Created in Windows Startup Folder
id: 04ed2bf8-a283-4959-86bf-42622eceb94d
status: experimental
description: |
    Detects creation of a file under a conventional Windows Startup folder path.
    A path match does not establish execution or resolve redirected known folders.
    Only desktop.ini is excluded; other file extensions remain visible.
references:
    - https://learn.microsoft.com/en-us/windows/win32/shell/knownfolderid
    - https://learn.microsoft.com/en-us/sysinternals/downloads/sysmon
author: jawsec
date: 2026-04-01
modified: 2026-09-17
tags:
    - attack.persistence
    - attack.t1547.001
logsource:
    category: file_event
    product: windows
detection:
    selection:
        TargetFilename|contains: '\Microsoft\Windows\Start Menu\Programs\Startup\'
    filter_main_metadata:
        TargetFilename|endswith: '\desktop.ini'
    condition: selection and not filter_main_metadata
falsepositives:
    - Approved installers, logon scripts, and restored startup items
level: medium
